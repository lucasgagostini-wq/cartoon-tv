<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C110E">
<meta name="mobile-web-app-capable" content="yes">
<title>Controle · Cartoon TV</title>
<style>
  :root {
    --bg:#0C110E; --borda:#1E2B22; --borda-bt:#24332A;
    --texto:#9DB3A6; --texto-forte:#C2D6C8; --texto-fraco:#66806F;
    --titulo:#E8FFF0; --verde:#35E070; --verde-dim:#4F9A68; --trilha:#1D3325;
    --bt-bg:#121A15; --bt-hover:#17231A;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:12px; background:var(--bg); color:var(--texto);
    font:12px/1.45 Consolas,'Cascadia Mono','Courier New',monospace;
    user-select:none; overflow-x:hidden;
  }
  .bloco { border:1px solid var(--borda); border-radius:5px; padding:10px 11px; }
  .bloco + .bloco { margin-top:9px; }
  .cab { display:flex; align-items:center; gap:7px; margin-bottom:8px;
         font-size:10px; letter-spacing:.14em; color:var(--verde-dim); }
  .cab .linha { flex:1; height:1px; background:var(--borda); }
  .cab .relogio { color:var(--verde); letter-spacing:.04em; }
  .serie { font-size:15px; font-weight:700; color:var(--titulo); margin-bottom:2px;
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ep { color:var(--texto-forte); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { font-size:11px; color:var(--texto-fraco); margin-bottom:9px; }
  .barra { height:10px; letter-spacing:-.5px; white-space:nowrap; overflow:hidden; color:var(--verde); }
  .barra .vazio { color:var(--trilha); }
  .resta { display:flex; justify-content:space-between; font-size:11px; margin-top:5px; color:var(--texto-fraco); }
  .resta b { color:var(--verde); font-weight:600; }
  .botoes,.acao { display:flex; gap:7px; margin-top:11px; }
  .bt { flex:1; text-align:center; padding:7px 0; font-size:11.5px; cursor:pointer;
        border:1px solid var(--borda-bt); border-radius:4px; background:var(--bt-bg); color:var(--texto-forte); }
  .bt:hover { background:var(--bt-hover); border-color:var(--verde); color:var(--titulo); }
  .bt.off { opacity:.3; cursor:default; }
  .bt.off:hover { background:var(--bt-bg); border-color:var(--borda-bt); color:var(--texto-forte); }
  .lista { display:flex; flex-direction:column; gap:1px; min-height:20px; }
  .item { display:flex; gap:9px; padding:3px 4px; font-size:11.5px; border-radius:3px; }
  .item .h { flex:none; width:40px; color:var(--verde-dim); }
  .item .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .te { flex:none; font-size:10.5px; color:var(--texto-fraco); }
  .item.int .n { opacity:.55; font-style:italic; }
  .item.pl { cursor:pointer; border:1px solid var(--borda-bt); background:var(--bt-bg); padding:5px 7px; align-items:center; }
  .item.pl:hover { border-color:var(--verde); background:var(--bt-hover); }
  .item.pl:hover .n { color:var(--titulo); }
  .item.pl .h { width:14px; color:var(--verde); }
  .item.pl + .item.pl { margin-top:4px; }
  .item.pl .acoes { display:flex; gap:2px; margin-left:6px; }
  .item.pl .acoes b { padding:2px 6px; border-radius:3px; font-weight:400; color:var(--texto-fraco); }
  .item.pl .acoes b:hover { background:var(--borda-bt); color:var(--titulo); }
  .item.pl.nova { border-style:dashed; opacity:.75; }
  .item.pl.nova:hover { opacity:1; }
  #contador { font-size:9.5px; color:var(--verde); letter-spacing:.06em; }
  #bt-salvar { flex:0 0 42px; }
  .busca { display:flex; align-items:center; gap:6px; padding:5px 8px; font-size:11.5px; margin-bottom:8px;
           border:1px solid var(--borda-bt); border-radius:4px; background:var(--bt-bg); color:var(--verde-dim); }
  .busca input { flex:1; background:none; border:0; outline:none; font:inherit; color:var(--titulo); user-select:text; }
  /* rola, mas sem barra à vista (o Lucas pediu: função sim, ícone não) */
  .chips { display:flex; flex-wrap:wrap; gap:4px; max-height:104px; overflow-y:auto; scrollbar-width:none; }
  .chips::-webkit-scrollbar { width:0; height:0; display:none; }
  .chip { padding:3px 7px; font-size:11px; cursor:pointer;
          border:1px solid var(--borda-bt); border-radius:3px; background:var(--bt-bg); }
  .chip:hover { border-color:var(--verde); color:var(--titulo); }
  .chip.sel { border-color:var(--verde); color:var(--titulo); background:var(--bt-hover); }
  .badge { font-size:9.5px; letter-spacing:.1em; padding:1px 5px; border:1px solid var(--verde-dim);
           border-radius:3px; color:var(--verde); max-width:150px; overflow:hidden;
           text-overflow:ellipsis; white-space:nowrap; }
  .oculto { display:none; }
  #desligada { padding:22px 4px; text-align:center; color:var(--texto-fraco); }
  #desligada b { display:block; color:var(--verde); font-size:14px; margin-bottom:6px; }
  #erro { margin-top:8px; font-size:11px; color:#e07a35; min-height:14px; }

  /* link pro celular — só aparece no controle do PC */
  #fone .url { margin-top:7px; font-size:10.5px; color:var(--verde-dim); text-align:center;
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap; user-select:all; }
  .bt.destaque { border-color:var(--verde-dim); color:var(--titulo); }
  .bt.destaque:hover { background:var(--bt-hover); border-color:var(--verde); }
  .bt.feito { border-color:var(--verde); color:var(--verde); }

  /* No celular tudo cresce: dedo não acerta alvo de 7px, e hover não existe. */
  @media (pointer: coarse), (max-width: 520px) {
    body { padding:14px 12px calc(14px + env(safe-area-inset-bottom)); font-size:14px; }
    .serie { font-size:19px; }
    .ep, .item, .chip, .bt { font-size:14px; }
    .bt { padding:14px 0; }
    .item { padding:9px 6px; }
    .item.pl { padding:11px 9px; }
    .chip { padding:9px 12px; }
    .chips { max-height:none; }
    .busca { padding:10px 12px; }
    .busca input { font-size:16px; }   /* < 16px faz o iPhone dar zoom ao focar */
    .cab { font-size:11px; }
    .bt:hover, .chip:hover, .item.pl:hover { background:var(--bt-bg); border-color:var(--borda-bt); }
    .bt:active { background:var(--bt-hover); border-color:var(--verde); color:var(--titulo); }
    .chip:active, .item.pl:active { border-color:var(--verde); color:var(--titulo); }
    #fone { display:none; }
  }
</style>
</head>
<body>

<div id="desligada" class="bloco oculto"><b>TV desligada</b>abra pelo atalho “Cartoon TV”</div>

<div id="painel">
  <div class="bloco">
    <div class="cab">&#9679; NO AR <span id="badge" class="badge oculto"></span><span class="linha"></span><span id="relogio" class="relogio">--:--:--</span></div>
    <div id="serie" class="serie">—</div>
    <div id="epi" class="ep">—</div>
    <div id="meta" class="meta">—</div>
    <div class="barra"><span id="cheio"></span><span id="vazio" class="vazio"></span></div>
    <div class="resta"><span>faltam <b id="resta">--</b></span><span id="pct">--%</span></div>
    <div class="botoes">
      <div class="bt" data-cmd="pular">&#9197; pular</div>
      <div class="bt off" id="bt-voltar" data-cmd="voltar-grade">&#8617; voltar pra grade</div>
    </div>
  </div>

  <div class="bloco">
    <div class="cab"><span id="cab-seguir">A SEGUIR</span><span class="linha"></span></div>
    <div id="lista" class="lista"></div>
  </div>

  <div class="bloco" id="bloco-playlists">
    <div class="cab">PLAYLISTS<span class="linha"></span></div>
    <div id="playlists" class="lista"></div>
  </div>

  <div class="bloco">
    <div class="cab"><span id="cab-trocar">TROCAR PARA</span><span class="linha"></span><span id="contador"></span></div>
    <div class="busca"><span>&#62;</span><input id="filtro" placeholder="filtrar série..." autocomplete="off" spellcheck="false"></div>
    <div id="chips" class="chips"></div>
    <div class="acao" id="acao-normal">
      <div class="bt off" id="bt-ver" data-cmd="ver-agora">&#9654; ver agora</div>
      <div class="bt off" id="bt-fila" data-cmd="fila">&#8734; fila</div>
      <div class="bt off" id="bt-salvar" title="salvar as séries marcadas como playlist">&#128190;</div>
    </div>
    <div class="acao oculto" id="acao-edicao">
      <div class="bt" id="bt-confirmar">&#10003; salvar “<span id="nome-edicao"></span>”</div>
      <div class="bt" id="bt-cancelar">cancelar</div>
    </div>
    <div id="erro"></div>
  </div>

  <div class="bloco oculto" id="fone">
    <div class="cab">NO CELULAR<span class="linha"></span></div>
    <div class="bt destaque" id="fone-copiar">&#128241; copiar link do controle</div>
    <div class="url" id="fone-url"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let series = [], playlists = [], assinaturaLista = '';

// A chave vem na URL quando o controle é aberto do celular. No PC ela não existe e o
// servidor libera por ser 127.0.0.1 — então a mesma página serve aos dois.
const CHAVE = new URLSearchParams(location.search).get('k');
const rota = (p) => (CHAVE ? p + (p.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(CHAVE) : p);
let marcados = new Set();   // séries marcadas nos chips (seleção múltipla)
let editando = null;        // { id, nome } quando está editando uma playlist

const mmss = (s) => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + 'min' + String(s % 60).padStart(2, '0') + 's'; };
const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

function avisar(msg) {
  $('erro').textContent = msg || '';
  if (msg) setTimeout(() => { if ($('erro').textContent === msg) $('erro').textContent = ''; }, 4000);
}

// --- chips: só re-renderizam quando o usuário mexe, nunca no poll de 1s -------
function pintarChips() {
  const f = norm($('filtro').value);
  const vis = series.filter((s) => !f || norm(s.nome).includes(f) || s.slug.includes(f));
  $('chips').innerHTML = vis.map((s) =>
    '<span class="chip' + (marcados.has(s.slug) ? ' sel' : '') + '" data-slug="' + s.slug + '">' +
    (marcados.has(s.slug) ? '✓ ' : '') + s.nome + '</span>').join('')
    || '<span style="color:var(--texto-fraco)">nenhuma série</span>';
  for (const c of $('chips').children) {
    if (!c.dataset.slug) continue;
    c.onclick = () => {
      if (marcados.has(c.dataset.slug)) marcados.delete(c.dataset.slug); else marcados.add(c.dataset.slug);
      pintarChips(); ligarAcoes();
    };
  }
}

function ligarAcoes() {
  const n = marcados.size;
  $('contador').textContent = n ? n + ' marcada' + (n > 1 ? 's' : '') : '';
  $('acao-normal').classList.toggle('oculto', !!editando);
  $('acao-edicao').classList.toggle('oculto', !editando);
  $('cab-trocar').textContent = editando ? 'EDITANDO PLAYLIST' : 'TROCAR PARA';
  if (editando) { $('nome-edicao').textContent = editando.nome; return; }
  $('bt-ver').classList.toggle('off', n !== 1);   // "ver agora" é de uma série só
  $('bt-fila').classList.toggle('off', n < 1);
  $('bt-salvar').classList.toggle('off', n < 1);
}

// --- playlists: clique toca; ✎ edita; ✕ exclui -------------------------------
function pintarPlaylists() {
  $('playlists').innerHTML = playlists.map((p) =>
    '<div class="item pl" data-id="' + p.id + '" title="' + p.series.join(' · ') + '">' +
    '<span class="h">&#8734;</span>' +
    '<span class="n">' + p.nome + '</span>' +
    '<span class="te">' + p.series.length + '&nbsp;séries</span>' +
    '<span class="acoes"><b data-edit="' + p.id + '" title="editar as séries">&#9998;</b>' +
    '<b data-del="' + p.id + '" title="excluir">&#10005;</b></span></div>').join('')
    + '<div class="item pl nova" id="pl-nova"><span class="h">+</span>' +
      '<span class="n">nova playlist com as marcadas</span></div>';

  for (const el of $('playlists').children) {
    if (el.id === 'pl-nova') { el.onclick = () => novaPlaylist(); continue; }
    el.onclick = (ev) => {
      const alvo = ev.target.closest('b');
      if (alvo && alvo.dataset.edit) return editarPlaylist(alvo.dataset.edit);
      if (alvo && alvo.dataset.del) return excluirPlaylist(alvo.dataset.del);
      comando('playlist', el.dataset.id);
    };
  }
}

function editarPlaylist(id) {
  const p = playlists.find((x) => x.id === id);
  if (!p) return;
  editando = { id: p.id, nome: p.nome };
  marcados = new Set(p.slugs || []);
  $('filtro').value = '';
  pintarChips(); ligarAcoes();
  avisar('marque e desmarque as séries, depois salve');
}

function novaPlaylist() {
  if (!marcados.size) return avisar('marque as séries primeiro, ali embaixo');
  const nome = prompt('Nome da playlist:', '');
  if (!nome || !nome.trim()) return;
  salvar({ nome: nome.trim(), series: [...marcados] });
}

async function excluirPlaylist(id) {
  const p = playlists.find((x) => x.id === id);
  if (!p || !confirm('Excluir a playlist "' + p.nome + '"?')) return;
  try {
    const r = await fetch(rota('/playlists/excluir'), { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id }) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); return avisar('recusado: ' + (j.erro || r.status)); }
    await carregarCatalogo();
  } catch (e) { avisar('a TV não respondeu'); }
}

async function salvar({ id, nome, series }) {
  try {
    const r = await fetch(rota('/playlists/salvar'), { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id, nome, series }) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); return avisar('recusado: ' + (j.erro || r.status)); }
    editando = null; marcados.clear();
    await carregarCatalogo();
    avisar('playlist salva');
  } catch (e) { avisar('a TV não respondeu'); }
}

// --- atualização vinda do /estado: mexe só em texto, nunca recria o DOM -------
function pintar(e) {
  const viva = !!(e && e.ligada && e.agora);
  $('desligada').classList.toggle('oculto', viva);
  $('painel').classList.toggle('oculto', !viva);
  if (!viva) return;

  const a = e.agora;
  const pct = a.duracaoSeg ? Math.max(0, Math.min(1, a.decorridoSeg / a.duracaoSeg)) : 0;
  const cheio = Math.round(pct * 30);
  const emFila = e.origem === 'fila';

  $('relogio').textContent = new Date().toTimeString().slice(0, 8);
  $('serie').textContent = a.serie;
  $('epi').textContent = a.nome;
  $('meta').textContent = 'T' + a.temporada + ' E' + a.episodio + '  ·  ' +
    (e.origem === 'grade' ? 'começou ' + a.inicio : 'fora da grade');
  $('cheio').textContent = '█'.repeat(cheio);
  $('vazio').textContent = '░'.repeat(30 - cheio);
  $('resta').textContent = mmss(a.restanteSeg);
  $('pct').textContent = Math.round(pct * 100) + '%';

  // link do celular: só faz sentido no controle do PC, e só se a máquina tem IP de rede
  if (e.linkCelular && !CHAVE) {
    $('fone').classList.remove('oculto');
    $('fone-url').textContent = e.linkCelular;
  }

  const badge = $('badge');
  badge.classList.toggle('oculto', e.origem === 'grade');
  if (e.origem !== 'grade') badge.textContent = emFila ? 'FILA · ' + e.fila.serie : 'ZAP';
  $('bt-voltar').classList.toggle('off', e.origem === 'grade');
  $('cab-seguir').textContent = emFila ? 'FILA ALEATÓRIA' : 'A SEGUIR';

  // a lista só é redesenhada quando muda de verdade
  const itens = e.aSeguir || [];
  const assin = JSON.stringify(itens);
  if (assin !== assinaturaLista) {
    assinaturaLista = assin;
    $('lista').innerHTML = itens.map((s) =>
      '<div class="item' + (s.intervalo ? ' int' : '') + '"><span class="h">' + s.hora +
      '</span><span class="n">' + (s.intervalo ? '▸ ' : '') + s.serie +
      '</span><span class="te">' + s.te + '</span></div>').join('')
      || '<div class="item"><span class="n">—</span></div>';
  }
}

async function comando(tipo, idDireto) {
  const precisaSlug = tipo === 'ver-agora' || tipo === 'fila' || tipo === 'playlist';
  // "fila" com várias marcadas vira uma playlist na hora, sem precisar salvar nada
  const varias = tipo === 'fila' && !idDireto && marcados.size > 1;
  const slug = idDireto || [...marcados][0];
  if (precisaSlug && !slug) return;
  try {
    const corpo = varias
      ? { tipo: 'playlist-avulsa', series: [...marcados] }
      : (precisaSlug ? { tipo, slug } : { tipo });
    const r = await fetch(rota('/comando'), {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(corpo),
    });
    if (!r.ok) { const j = await r.json().catch(() => ({})); return avisar('recusado: ' + (j.erro || r.status)); }
    if (precisaSlug && !idDireto) { marcados.clear(); pintarChips(); ligarAcoes(); }
    atualizar();
  } catch (err) { avisar('a TV não respondeu'); }
}

async function atualizar() {
  try { pintar(await (await fetch(rota('/estado'))).json()); }
  catch (err) { pintar(null); }
}

document.querySelectorAll('.bt[data-cmd]').forEach((b) => {
  b.onclick = () => { if (!b.classList.contains('off')) comando(b.dataset.cmd); };
});
$('bt-salvar').onclick = () => { if (!$('bt-salvar').classList.contains('off')) novaPlaylist(); };
$('bt-confirmar').onclick = () => {
  if (!marcados.size) return avisar('a playlist não pode ficar vazia');
  salvar({ id: editando.id, nome: editando.nome, series: [...marcados] });
};
$('bt-cancelar').onclick = () => { editando = null; marcados.clear(); pintarChips(); ligarAcoes(); };

$('fone-copiar').onclick = async () => {
  const bt = $('fone-copiar'), txt = $('fone-url').textContent;
  try {
    window.focus();   // clipboard recusa com "Document is not focused"
    await navigator.clipboard.writeText(txt);
    bt.textContent = '✓ copiado — cole no celular';
    bt.classList.add('feito');
    setTimeout(() => { bt.innerHTML = '&#128241; copiar link do controle'; bt.classList.remove('feito'); }, 2500);
  } catch (e) {
    // clipboard pode falhar sem gesto/permissão: seleciona pra ele copiar no Ctrl+C
    const r = document.createRange();
    r.selectNodeContents($('fone-url'));
    getSelection().removeAllRanges(); getSelection().addRange(r);
    avisar('selecionei o link — copie com Ctrl+C');
  }
};

$('filtro').oninput = pintarChips;
$('filtro').onkeydown = (ev) => {
  if (ev.key === 'Escape') { $('filtro').value = ''; pintarChips(); }
  if (ev.key === 'Enter') {                       // Enter = marcar a primeira da lista filtrada
    const primeiro = $('chips').querySelector('.chip');
    if (primeiro) { marcados.add(primeiro.dataset.slug); $('filtro').value = ''; pintarChips(); ligarAcoes(); $('filtro').focus(); }
  }
};

// O Chrome estrangula setInterval em janela de fundo. Ao voltar o foco, atualiza na hora
// em vez de esperar o próximo tick — senão o controle mostra estado velho por segundos.
document.addEventListener('visibilitychange', () => { if (!document.hidden) atualizar(); });
window.addEventListener('focus', atualizar);

async function carregarCatalogo() {
  try { series = await (await fetch(rota('/series'))).json(); } catch (e) { series = []; }
  try { playlists = await (await fetch(rota('/playlists'))).json(); } catch (e) { playlists = []; }
  pintarChips(); pintarPlaylists(); ligarAcoes();
}

(async () => {
  await carregarCatalogo();
  atualizar();
  setInterval(atualizar, 1000);
  // Se a janelinha nasceu antes da TV entrar no ar, o catálogo veio vazio: tenta de novo.
  setInterval(() => { if (!series.length) carregarCatalogo(); }, 3000);
})();
</script>
</body>
</html>
